<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <!-- Background transparent -->
  
  <!-- Golden Crescent Moon -->
  <path d="M 200 50 A 130 130 0 1 1 70 180 A 100 100 0 1 0 230 100 Z" fill="#D4A373" />
  
  <!-- Longan fruits (brown circles) -->
  <circle cx="150" cy="180" r="40" fill="#78593F" />
  <circle cx="210" cy="220" r="45" fill="#78593F" />
  <circle cx="160" cy="260" r="45" fill="#78593F" />
  
  <!-- Peeled Longan (white circle with black seed) -->
  <circle cx="230" cy="220" r="40" fill="#FFF2E5" />
  <circle cx="240" cy="230" r="15" fill="#291D16" />
  <circle cx="243" cy="227" r="4" fill="#FFFFFF" />

  <!-- Green Leaves -->
  <path d="M 120 120 Q 90 150 70 200 Q 110 160 150 140 Z" fill="#4C7838" />
  <path d="M 150 140 Q 180 140 220 160 Q 180 120 130 110 Z" fill="#4C7838" />
  <path d="M 150 180 Q 120 220 110 260 Q 140 240 160 210 Z" fill="#4C7838" />

  <!-- Stem -->
  <path d="M 100 100 L 150 150 L 160 180" stroke="#4C7838" stroke-width="6" fill="none" />
  
  <!-- Decorative swashes at bottom -->
  <path d="M 140 310 Q 200 290 260 320 Q 200 340 140 310" fill="#D4A373" />
  
  <!-- Text -->
  <text x="200" y="370" font-family="serif" font-size="42" font-weight="bold" fill="#2C3E26" text-anchor="middle">Nguyệt Nhãn</text>
  <text x="200" y="395" font-family="serif" font-size="24" fill="#2C3E26" text-anchor="middle">Phố Hiến</text>
</svg>
